# main 브랜치에 푸시할 때마다 정적 빌드(out/)를 GitHub Pages 에 배포한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # 전제: 저장소 Settings → Pages → Source 가 "GitHub Actions" 로 켜져 있어야 한다.
      - uses: actions/configure-pages@v5

      - run: npm ci
      - run: npm run build

      # public/.nojekyll 이 복사되지만, 혹시 빠져도 _next 폴더가 무시되지 않도록 한 번 더 보장한다.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
